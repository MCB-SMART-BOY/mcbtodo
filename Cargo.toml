[workspace]
resolver = "3"
members = ["apps/mcbtodo", "apps/mcbtodo-daemon", "apps/mcbtodo-worker", "crates/agent-codex", "crates/application", "crates/client", "crates/domain", "crates/execution", "crates/platform", "crates/plugin", "crates/ports", "crates/protocol", "crates/storage-sqlite", "crates/tui", "crates/vault", "crates/workflow", "xtask"]
default-members = ["apps/mcbtodo"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
publish = true
license = "Apache-2.0"
repository = "https://github.com/MCB-SMART-BOY/mcbtodo"

[workspace.dependencies]
anyhow = "1"
base64 = "0.23"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = { version = "0.10.4", features = ["serde"] }
clap = { version = "4.6", features = ["derive"] }
crossterm = "0.29"
hex = "0.4"
icalendar = { version = "0.17.17", default-features = false }
mcbtodo-agent-codex = { path = "crates/agent-codex", version = "0.1.0" }
mcbtodo-client = { path = "crates/client", version = "0.1.0" }
mcbtodo-domain = { path = "crates/domain", version = "0.1.0" }
mcbtodo-execution = { path = "crates/execution", version = "0.1.0" }
mcbtodo-application = { path = "crates/application", version = "0.1.0" }
mcbtodo-platform = { path = "crates/platform", version = "0.1.0" }
mcbtodo-plugin = { path = "crates/plugin", version = "0.1.0" }
mcbtodo-ports = { path = "crates/ports", version = "0.1.0" }
mcbtodo-protocol = { path = "crates/protocol", version = "0.1.0" }
mcbtodo-storage-sqlite = { path = "crates/storage-sqlite", version = "0.1.0" }
mcbtodo-workflow = { path = "crates/workflow", version = "0.1.0" }
mcbtodo-vault = { path = "crates/vault", version = "0.1.0" }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
mcbtodo-tui = { path = "crates/tui", version = "0.1.0" }
rusqlite = { version = "0.43", features = ["bundled"] }
rustix = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-saphyr = "1.3"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
toml = "1"
uuid = { version = "1", features = ["serde", "v5"] }

[workspace.lints.rust]
unsafe_code = "forbid"
