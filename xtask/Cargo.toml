[package]
name = "mcbtodo-xtask"
repository.workspace = true
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
license.workspace = true
description = "Repository development tasks for the mcbtodo workspace."

[[bin]]
name = "xtask"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
clap.workspace = true
hex.workspace = true
mcbtodo-platform.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
toml.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
base64.workspace = true
chrono.workspace = true
mcbtodo-agent-codex.workspace = true
mcbtodo-ports.workspace = true
mcbtodo-protocol.workspace = true
rustix = { workspace = true, features = ["fs", "pty", "termios"] }
vt100 = "0.18.1"
