[package]
name = "mcbtodo-vault"
repository.workspace = true
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
license-file.workspace = true
description = "Markdown Vault persistence, validation, and durable event storage for mcbtodo."
documentation = "https://docs.rs/mcbtodo-vault"

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
chrono.workspace = true
chrono-tz.workspace = true
mcbtodo-domain.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
serde-saphyr.workspace = true
sha2.workspace = true
tempfile.workspace = true
uuid = { workspace = true, features = ["v4"] }

[target.'cfg(any(target_os = "linux", target_os = "android", target_vendor = "apple"))'.dependencies]
rustix = { workspace = true, features = ["fs"] }
