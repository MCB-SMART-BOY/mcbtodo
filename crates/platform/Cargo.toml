[package]
name = "mcbtodo-platform"
repository.workspace = true
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
description = "Operating-system, workspace-path, and agent-policy support for mcbtodo."
documentation = "https://docs.rs/mcbtodo-platform"

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
chrono-tz.workspace = true
serde.workspace = true
tempfile.workspace = true
toml.workspace = true
uuid = { workspace = true, features = ["v4"] }

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["fs", "process"] }

[target.'cfg(target_os = "linux")'.dependencies]
mcbtodo-ports.workspace = true
rustix = { workspace = true, features = ["event", "net"] }
