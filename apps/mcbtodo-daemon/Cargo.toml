[package]
name = "mcbtodo-daemon"
repository.workspace = true
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
description = "Background daemon for mcbtodo scheduling, reminders, and workflow execution."
documentation = "https://docs.rs/mcbtodo-daemon"

[dependencies]
anyhow.workspace = true
chrono.workspace = true
chrono-tz.workspace = true
clap.workspace = true
mcbtodo-domain.workspace = true
mcbtodo-application.workspace = true
mcbtodo-platform.workspace = true
mcbtodo-protocol.workspace = true
mcbtodo-workflow.workspace = true
mcbtodo-vault.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
thiserror.workspace = true
toml.workspace = true
uuid = { workspace = true, features = ["v4"] }

[target.'cfg(target_os = "linux")'.dependencies]
mcbtodo-execution.workspace = true
mcbtodo-ports.workspace = true
mcbtodo-storage-sqlite.workspace = true
rustix = { workspace = true, features = ["event", "fs", "net", "process"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
rusqlite.workspace = true

[lints]
workspace = true
