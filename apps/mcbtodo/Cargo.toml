[package]
name = "mcbtodo"
repository.workspace = true
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
description = "A local-first task manager with a calendar TUI and workflow automation."
documentation = "https://docs.rs/mcbtodo"

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
base64.workspace = true
chrono.workspace = true
clap.workspace = true
crossterm.workspace = true
mcbtodo-application.workspace = true
mcbtodo-domain.workspace = true
mcbtodo-platform.workspace = true
mcbtodo-protocol.workspace = true
mcbtodo-workflow.workspace = true
chrono-tz.workspace = true
icalendar = { workspace = true, features = ["parser"] }
mcbtodo-vault.workspace = true
ratatui.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
toml.workspace = true
uuid = { workspace = true, features = ["v4"] }

[target.'cfg(target_os = "linux")'.dependencies]
mcbtodo-execution.workspace = true

[target.'cfg(unix)'.dependencies]
hex.workspace = true
mcbtodo-storage-sqlite.workspace = true
rustix = { workspace = true, features = ["fs", "process"] }

[target.'cfg(unix)'.dev-dependencies]
mcbtodo-ports.workspace = true
rusqlite.workspace = true
