name: Linux CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            runner: ubuntu-24.04-arm
          - arch: x86_64
            runner: ubuntu-24.04
    env:
      CARGO_TERM_COLOR: always
      RUSTUP_TOOLCHAIN: 1.100.0
      ARCH: ${{ matrix.arch }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Rust on the native runner
        run: |
          test "$(uname -m)" = "$ARCH"
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt --component clippy

      - name: Check the workspace
        run: cargo xtask check

      - name: Validate the example Vault
        run: cargo run --locked -- --vault examples/vault --timezone Asia/Shanghai validate

      - name: Validate publishable workspace packages
        run: cargo package --workspace --exclude mcbtodo-xtask --locked --no-verify

      - name: Verify crate license metadata and archive contents
        run: cargo xtask verify-crate-packages

      - name: Build the app, daemon, and worker
        run: cargo build --release --locked --workspace --bin mcbtodo --bin mcbtodo-daemon --bin mcbtodo-worker

      - name: Install sandbox smoke dependencies
        run: sudo apt-get update && sudo apt-get install --yes bubblewrap nushell jq

      - name: Package the release binaries
        run: |
          cargo xtask package --out-dir "$RUNNER_TEMP"
          (
            cd "$RUNNER_TEMP"
            archive="mcbtodo-linux-$ARCH.tar.gz"
            sha256sum "$archive" > "$archive.sha256"
          )

      - name: Smoke-test the packaged binaries
        run: |
          (cd "$RUNNER_TEMP" && sha256sum --check "mcbtodo-linux-$ARCH.tar.gz.sha256")
          package_dir="$(mktemp -d "$RUNNER_TEMP/mcbtodo-package.XXXXXXXX")"
          tar -xzf "$RUNNER_TEMP/mcbtodo-linux-$ARCH.tar.gz" -C "$package_dir"
          cmp deploy/systemd/mcbtodo-daemon.service "$package_dir/usr/lib/systemd/user/mcbtodo-daemon.service"
          test -x "$package_dir/usr/bin/mcbtodo-worker"
          cargo xtask smoke --bin-dir "$package_dir/usr/bin" --sandbox

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: mcbtodo-linux-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/mcbtodo-linux-${{ matrix.arch }}.tar.gz
            ${{ runner.temp }}/mcbtodo-linux-${{ matrix.arch }}.tar.gz.sha256
          if-no-files-found: error
          compression-level: 0

